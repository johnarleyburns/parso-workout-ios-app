<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Post-set RPE</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Post-set RPE</h1>
        <p>Optional effort capture after a set. The Crown controls the value, and Skip is always available.</p>
      </div>
      <div class="mockup-meta"><span class="tag">K.13</span><span class="tag">RPE input</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-kicker">Set logged / how hard?</div>
        <div class="watch-big" style="text-align:center;font-size:58px;">8</div>
        <div class="watch-sub" style="text-align:center;">RPE / Crown to set</div>
        <div class="rpe-dots"><span></span><span></span><span></span><span></span><span class="active"></span><span></span><span></span></div>
        <div class="spacer"></div>
        <div class="watch-button">Save RPE 8</div>
        <div class="watch-sub" style="text-align:center;">Skip</div>
      </div></div>
    </section>
  </main>
</body>
</html>
