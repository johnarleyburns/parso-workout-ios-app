name: Claude Issue Controller
run-name: Reconcile one repository-local issue intake
on:
  issues:
    # Every new or reopened issue enters the controller queue automatically.
    # Reconcile when a stale intake lock is removed too. Without `unlabeled`,
    # recovering a failed worker waits for the best-effort cron sweep.
    types: [opened, reopened, labeled, unlabeled, closed]
  workflow_run:
    workflows: ["iOS Build & TestFlight", "iOS"]
    types: [completed]
  schedule:
    # Recovery only: GitHub cron may be delayed or dropped.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: claude-issue-controller
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.actor == 'johnarleyburns' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'unlabeled' || github.event.action == 'closed' || github.event.label.name == 'ai-ready' || github.event.label.name == 'retry-ai' || github.event.label.name == 'priority-high' || github.event.label.name == 'qa-failed')) ||
      (github.event_name == 'workflow_run' && vars.CLAUDE_PIPELINE_AUTO_ENABLED == 'true') ||
      (github.event_name == 'schedule' && vars.CLAUDE_PIPELINE_AUTO_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Default token: label/reopen/comment writes this job makes on itself
      # are then attributed to github-actions[bot], not johnarleyburns, so
      # they don't re-satisfy the `issues` actor check above and requeue this
      # same workflow. CLAUDE_WORKFLOW_TOKEN is still used for the one call
      # that needs actions:write (dispatching issue-to-pr.yml).
      #
      # 2026-11-10 follow-up: a burst of several overlapping reconcile runs
      # within seconds of each other was still observed hours after this
      # fix landed. Audited every label/comment-writing call site in
      # admit-one-stranded-issue.sh (the only caller) - all already use this
      # bot token, not CLAUDE_WORKFLOW_TOKEN, so no second leak was found.
      # The likely remaining cause is legitimate, disjoint triggers (several
      # `workflow_run` completions, the cron sweep, and a genuine human edit)
      # landing in the same few seconds and each separately passing this
      # `if:`, not a bug in this check - left as-is rather than dropping the
      # `issues:` trigger, which regresses the tested qa-failed/opened/
      # reopened fast-path (see test-issue-pr-policy.sh). Needs a dedicated
      # look at actual run metadata next time it happens, not a blunt trigger
      # removal.
      GH_TOKEN: ${{ github.token }}
      CLAUDE_WORKFLOW_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      CLAUDE_PIPELINE_AUTO_ENABLED: ${{ vars.CLAUDE_PIPELINE_AUTO_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - run: |
          test -n "$CLAUDE_WORKFLOW_TOKEN" || { echo '::error::CLAUDE_WORKFLOW_TOKEN is not configured'; exit 1; }
          bash .github/scripts/admit-one-stranded-issue.sh
