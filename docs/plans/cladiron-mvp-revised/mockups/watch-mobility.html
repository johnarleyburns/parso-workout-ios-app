<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Mobility Item</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Mobility Item</h1>
        <p>First-class mobility/checklist item, not a fake strength exercise. Visual target for the altered cooldown/mobility view.</p>
      </div>
      <div class="mockup-meta"><span class="tag">WatchCoolDownView</span><span class="tag">Mobility</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-kicker">Mobility / 1 of 2</div>
        <div class="watch-title">Hip Flexor</div>
        <div class="watch-sub">Right side</div>
        <div class="watch-big">0:30</div>
        <div class="watch-mid">Relax, do not force</div>
        <div class="spacer"></div>
        <div class="watch-button">Start Timer</div>
      </div></div>
    </section>
  </main>
</body>
</html>
