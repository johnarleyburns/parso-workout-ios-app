<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Rest Timer</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Rest Timer</h1>
        <p>Countdown, next-set preview, and a skip affordance. Visual target for WatchRestView.</p>
      </div>
      <div class="mockup-meta"><span class="tag">WatchRestView</span><span class="tag">K.13 rest</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-kicker">Rest</div>
        <div class="watch-big" style="font-size:54px;">1:46</div>
        <div class="watch-mid">Target 2:00</div>
        <div class="watch-row" style="margin-top:14px;"><strong>Next</strong>6 x 160 lb / RPE 8</div>
        <div class="spacer"></div>
        <div class="watch-button dark">Skip Rest</div>
      </div></div>
    </section>
  </main>
</body>
</html>
