name: PR Swift Validation
# Read-only: no write token, no release/signing secrets. Runs the shared
# scripts/ci-validate.sh so issue agent, repair agent and CI cannot drift.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: xcode-27
    # Safe fallback for the unavailable repository-wide two-permit semaphore.
    # This serializes all macOS jobs; Ubuntu maintenance remains independent.
    concurrency:
      group: cadence-macos
      cancel-in-progress: false
      queue: max
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Validate (shell, YAML, automation tests, Swift tests, builds, guardrails)
        run: bash scripts/ci-validate.sh
