<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Session RPE</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Session RPE</h1>
        <p>Optional overall effort input after the final item, before the completion summary.</p>
      </div>
      <div class="mockup-meta"><span class="tag">K.13</span><span class="tag">Session effort</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-kicker">Workout done / overall?</div>
        <div class="watch-big" style="text-align:center;font-size:58px;">7</div>
        <div class="watch-sub" style="text-align:center;">Session RPE / Crown</div>
        <div class="rpe-dots"><span></span><span></span><span></span><span class="active"></span><span></span><span></span><span></span></div>
        <div class="spacer"></div>
        <div class="watch-button">Save</div>
        <div class="watch-sub" style="text-align:center;">Skip</div>
      </div></div>
    </section>
  </main>
</body>
</html>
