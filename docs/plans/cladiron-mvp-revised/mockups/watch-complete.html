<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Complete Summary</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Complete Summary</h1>
        <p>Session completion confirms local save and queued/synced write-back after the runtime session ends.</p>
      </div>
      <div class="mockup-meta"><span class="tag">WatchStrengthSummaryView</span><span class="tag">Queue sync</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-summary">
          <div>
            <div class="checkmark">&check;</div>
            <div class="watch-title">Complete</div>
            <div class="watch-sub">18 sets / cardio / 38 min</div>
            <div class="watch-mid" style="color:var(--green);margin-top:8px;">Synced to coach</div>
          </div>
        </div>
      </div></div>
    </section>
  </main>
</body>
</html>
