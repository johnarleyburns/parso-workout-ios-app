name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never cancel an in-flight release build (build numbers must stay monotonic);
# later merges queue behind it.
concurrency:
  group: ios-main-release
  cancel-in-progress: false

jobs:
  core-tests:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select supported release Xcode
        run: |
          # The runner image also contains beta builds. App Store Connect
          # rejects archives made with a beta SDK (90534), so TestFlight and
          # host tests must select the newest non-beta/non-RC installation.
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' \
            ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            CadenceCore/.build
          key: spm-core-${{ hashFiles('CadenceCore/Package.resolved') }}
          restore-keys: spm-core-

      - name: Run SwiftPM package tests
        run: |
          set -eo pipefail
          swift package resolve --package-path CadenceCore
          swift build --package-path CadenceCore 2>&1 | tee swift-build.log
          swift test --package-path CadenceCore 2>&1 | tee swift-test.log

      - name: Check owned warnings
        if: always()
        run: bash scripts/check-owned-warnings.sh swift-build.log swift-test.log

      - name: Check warning classifier fixtures
        run: bash scripts/test-check-owned-warnings.sh

      - name: Check TestFlight reporting fixture
        run: bash scripts/tests/test-testflight-delivery-body.sh

      - name: Test-pyramid guardrail
        run: bash scripts/check-test-pyramid.sh

      - name: No-network guardrail
        run: bash scripts/check-no-network.sh

      - name: History persistence safety guardrail
        run: bash scripts/check-history-safety.sh

      - name: Watch AppIcon and Xcode platform guardrails
        run: |
          bash scripts/check-watch-appicon.sh
          bash scripts/check-watch-background-modes.sh
          bash scripts/check-xcodebuild-platform.sh
          bash scripts/check-ci-no-simulators.sh
          bash scripts/check-release-safety.sh

  # XCUITest smoke suites are intentionally NOT run in CI: simulator-based UI
  # tests are unreliable on shared GitHub Actions runners (cold-launch timing,
  # shared CPU). The reliable CI gate is core-tests (host SwiftPM package tests +
  # guardrails). UI smoke runs locally via `make smoke` and `make watch-smoke`.

  testflight-build:
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    needs: core-tests
    runs-on: xcode-27
    # Archives can legitimately be slower than a compile, but must not consume
    # a permit forever if Xcode or an external signing service stops responding.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select supported release Xcode
        run: |
          # Never let a beta Xcode win merely because it sorts newest: App
          # Store Connect rejects beta SDK archives with error 90534.
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' \
            ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - name: Import Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o certificate.p12
          security import certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Import Provisioning Profiles
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          WATCH_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Workout_App_Store.mobileprovision"
          echo -n "$WATCH_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Workout_Watch_App_Store.mobileprovision"
          echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Workout_Widgets_App_Store.mobileprovision"
          echo -n "$WATCH_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$HOME/Library/MobileDevice/Provisioning Profiles/Parso_Workout_Watch_Widgets_App_Store.mobileprovision"

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ hashFiles('CadenceCore/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence

      - name: Set App/TestFlight Build Number
        run: |
          set -eo pipefail
          # CFBundleVersion is the number shown by AboutView and must remain
          # monotonically increasing for App Store Connect. GitHub's workflow
          # run_number is a separate UI identifier and must not be used here.
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "App/TestFlight build number (About screen): $BUILD"
          {
            echo "### App/TestFlight build"
            echo "- App Store build / About screen: **$BUILD**"
            echo "- GitHub Actions workflow run: **#${GITHUB_RUN_NUMBER}** (separate identifier)"
          } >> "$GITHUB_STEP_SUMMARY"
          cd Cadence && xcrun agvtool new-version -all "$BUILD"

      - name: Compute Marketing Version
        run: |
          set -eo pipefail
          echo "MKT_VERSION=1.1.$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Marketing version: 1.1.$BUILD_NUMBER (build $BUILD_NUMBER)"

      - name: Write App Store Connect API Key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Archive
        id: archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          archive_diagnostics() {
            status=$?
            echo "::group::Archive diagnostics (exit $status)"
            date -u
            ps -axo pid,ppid,etime,command | grep -E '[x]codebuild|[s]wift|[x]cbuild' || true
            tail -200 build.log 2>/dev/null || true
            echo "::endgroup::"
            return "$status"
          }
          trap archive_diagnostics ERR
          bash scripts/xcodebuild-safe.sh archive \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Cadence.xcarchive \
            MARKETING_VERSION="$MKT_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            "DEVELOPMENT_TEAM=$TEAM_ID" \
            2>&1 | tee build.log
          if [ ! -d "./build/Cadence.xcarchive" ]; then
            echo "Archive not found — build failed"
            grep -E 'error:' build.log | head -20
            exit 1
          fi

          IOS_PLIST="./build/Cadence.xcarchive/Products/Applications/Cadence.app/Info.plist"
          WATCH_PLIST="./build/Cadence.xcarchive/Products/Applications/Cadence.app/Watch/Cadence Watch App Watch App.app/Info.plist"
          for PLIST in "$IOS_PLIST" "$WATCH_PLIST"; do
            if [ ! -f "$PLIST" ]; then
              echo "Missing archived bundle Info.plist: $PLIST"
              exit 1
            fi
            SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
            echo "$PLIST: $SHORT ($VERSION)"
            test "$SHORT" = "$MKT_VERSION"
            test "$VERSION" = "$BUILD_NUMBER"
          done

      - name: Check owned archive warnings
        id: warnings
        if: success()
        run: bash scripts/check-owned-warnings.sh build.log

      - name: Normalize watch background modes
        if: success()
        run: |
          set -eo pipefail
          # UIBackgroundModes keeps only audio (short workout audio clips).
          # workout-processing is not a valid UIBackgroundModes value for a
          # watchOS app and is rejected by App Store Connect validation; it
          # belongs in WKBackgroundModes, which this step leaves alone. Without
          # it watchOS suspends the app when the screen turns off, and live
          # heart rate stops reaching the phone.
          WATCH_PLIST="./build/Cadence.xcarchive/Products/Applications/Cadence.app/Watch/Cadence Watch App Watch App.app/Info.plist"
          if [ ! -f "$WATCH_PLIST" ]; then
            echo "Watch Info.plist not found at expected path, trying alternate..."
            WATCH_PLIST=$(find ./build/Cadence.xcarchive -path "*/Watch/*.app/Info.plist" | head -1)
          fi
          if [ -f "$WATCH_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$WATCH_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$WATCH_PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$WATCH_PLIST"
            echo "Preserved audio in $WATCH_PLIST"
            if ! /usr/libexec/PlistBuddy -c "Print :WKBackgroundModes" "$WATCH_PLIST" 2>/dev/null | grep -q "workout-processing"; then
              echo "Watch Info.plist is missing WKBackgroundModes workout-processing"
              exit 1
            fi
            echo "Kept WKBackgroundModes workout-processing in $WATCH_PLIST"
          fi

      - name: Verify release dSYMs cover every app binary
        run: bash scripts/verify-archive-dsyms.sh ./build/Cadence.xcarchive

      - name: Retain release dSYMs for crash resolution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # BUILD_NUMBER is the same monotonic CFBundleVersion sent to TestFlight.
          name: testflight-dsyms-${{ env.BUILD_NUMBER }}
          path: build/Cadence.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 90

      - name: Export IPA
        id: export
        run: |
          set -eo pipefail
          xcodebuild -exportArchive \
            -archivePath ./build/Cadence.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        id: upload
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          upload_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          cp ExportOptions.plist "$upload_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$upload_options"
          bash .github/scripts/testflight-upload.sh -- \
            xcodebuild -exportArchive \
              -archivePath ./build/Cadence.xcarchive \
              -exportPath ./output \
              -exportOptionsPlist "$upload_options" \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Upload TestFlight transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-transport.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record TestFlight delivery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: Cadence
          ARCHIVED_APP: ./build/Cadence.xcarchive/Products/Applications/Cadence.app
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
        run: bash .github/scripts/record-testflight-delivery.sh

      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-diagnostics-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record failing stage
        id: stage
        if: always()
        env:
          ARCHIVE: ${{ steps.archive.outcome }}
          WARNINGS: ${{ steps.warnings.outcome }}
          EXPORT: ${{ steps.export.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          stage=setup
          if [[ "$UPLOAD" == success ]]; then stage=uploaded
          elif [[ "$UPLOAD" == failure ]]; then stage=upload
          elif [[ "$EXPORT" == failure ]]; then stage=export
          elif [[ "$WARNINGS" == failure ]]; then stage=warnings
          elif [[ "$ARCHIVE" == failure ]]; then stage=archive
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

  # Records the post-merge outcome on the merged PR. Uses only GITHUB_TOKEN with
  # issue/PR comment scope and no release secrets. "Uploaded" means Xcode's
  # accepted the build; Apple processing / tester availability is NOT claimed.
  deployment-report:
    needs: [core-tests, testflight-build]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Report deployment outcome
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.core-tests.result }}
          BUILD: ${{ needs.testflight-build.result }}
          STAGE: ${{ needs.testflight-build.outputs.stage }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$TESTS" != success ]]; then
            status="FAILED at package tests/guardrails (code-related: needs a new protected repair PR; main is never rewritten)"
          elif [[ "$BUILD" == success && "$STAGE" == uploaded ]]; then
            status="build archived, exported and uploaded to App Store Connect (processing/tester availability not yet confirmed)"
          else
            case "$STAGE" in
              archive) status="FAILED at archive compilation (code-related: see build log artifact; not a signing issue unless the log says so)" ;;
              warnings) status="FAILED at the owned archive warning gate (code-related: fix the application-owned compiler warning; not a signing or App Store Connect problem)" ;;
              export) status="FAILED at IPA export (check provisioning profiles/ExportOptions; owner action may be needed)" ;;
              upload) status="FAILED at TestFlight upload (check App Store Connect API credentials/status; owner action may be needed)" ;;
              *) status="FAILED before archive (setup: certificates, profiles, package resolution; job result: $BUILD)" ;;
            esac
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' || { echo "::warning::could not look up PR"; true; })
          msg="**Post-merge deployment ($SHA):** $status. [Run]($url)"
          if [[ -n "$pr" ]]; then gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$msg" || echo "::warning::could not post PR comment"; fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TESTS" != success || "$BUILD" != success ]]; then
            echo "::error::$status"; exit 1
          fi
