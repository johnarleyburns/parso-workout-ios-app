name: Claude Issue to Draft PR
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number
        required: true
        type: number
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: claude-issue-agent-global
  queue: max
  cancel-in-progress: false
jobs:
  implement:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'johnarleyburns') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login == 'johnarleyburns') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai-ready' && github.actor == 'johnarleyburns')
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: sonnet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      - name: Install Claude Code
        run: |
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Implement and update draft PR
        run: |
          cp .github/scripts/issue-to-pr.sh "$RUNNER_TEMP/issue-to-pr-runner.sh"
          bash "$RUNNER_TEMP/issue-to-pr-runner.sh"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ env.ISSUE }}-validation
          path: /tmp/claude-issue-logs/
          if-no-files-found: ignore
          retention-days: 7
