name: OpenCode PR Maintenance
# Reconciler / orchestrator. Runs on a cheap Linux runner, checks out ONLY the
# trusted default branch (never PR code), and holds no agent or release
# secrets. It reads authoritative GitHub state for every open automation PR and
# performs narrow API actions (ready, auto-merge, update-branch, re-run,
# dispatch repair, escalate). See docs/CI_AUTOMATION.md.
on:
  workflow_run:
    workflows: ["iOS", "OpenCode PR Conflict Repair", "OpenCode Issue to PR"]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Reconcile one PR (also clears a needs-human-review stop and resets its retry budget)
        required: false
        type: number
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
# Every run sweeps ALL open automation PRs, so one pending run covers any number of
# coalesced requests: nothing is lost when a queued run is superseded. Runs are
# serialized so there is a single orchestrator writer at a time.
concurrency:
  group: claude-pr-maintenance
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'johnarleyburns') ||
      (github.event_name != 'workflow_dispatch' && vars.CLAUDE_PR_MAINTENANCE_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      TARGET_PR: ${{ inputs.pr_number }}
      QUARANTINED_WORKFLOW_RUN_ID: ${{ vars.CLAUDE_QUARANTINED_WORKFLOW_RUN_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile automation PRs
        run: |
          test -n "$GH_TOKEN" || { echo '::error::CLAUDE_WORKFLOW_TOKEN is not configured'; exit 1; }
          cp .github/scripts/pr-maintenance.sh "$RUNNER_TEMP/pr-maintenance-runner.sh"
          bash "$RUNNER_TEMP/pr-maintenance-runner.sh"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-maintenance-${{ github.run_id }}
          path: /tmp/pr-maintenance-report.json
          if-no-files-found: ignore
          retention-days: 7

  prune-caches:
    # Merges are when pull-request caches become unreachable (GitHub only
    # restores a PR cache for the PR that wrote it) and start evicting the
    # default-branch seeds every PR depends on.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Delete unreachable and over-budget caches
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::CLAUDE_WORKFLOW_TOKEN is not configured'; exit 1; }
          bash .github/scripts/prune-pr-caches.sh
