name: Claude Issue Controller
run-name: Reconcile one repository-local issue intake
on:
  issues:
    # Every new or reopened issue enters the controller queue automatically.
    types: [opened, reopened, labeled, closed]
  workflow_run:
    workflows: ["iOS Build & TestFlight", "iOS"]
    types: [completed]
  schedule:
    # Recovery only: GitHub cron may be delayed or dropped.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: claude-issue-controller
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues') ||
      (github.event_name == 'workflow_run' && vars.CLAUDE_PIPELINE_AUTO_ENABLED == 'true') ||
      (github.event_name == 'schedule' && vars.CLAUDE_PIPELINE_AUTO_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      CLAUDE_PIPELINE_AUTO_ENABLED: ${{ vars.CLAUDE_PIPELINE_AUTO_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - run: |
          test -n "$GH_TOKEN" || { echo '::error::CLAUDE_WORKFLOW_TOKEN is not configured'; exit 1; }
          bash .github/scripts/admit-one-stranded-issue.sh
