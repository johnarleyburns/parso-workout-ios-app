<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Cardio Target</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Cardio Target</h1>
        <p>Interval work block with live heart rate, intensity target, and next segment preview.</p>
      </div>
      <div class="mockup-meta"><span class="tag">WatchCardioSessionView</span><span class="tag">K.13 cardio</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-kicker">Bike / work 3 of 6</div>
        <div class="watch-big">0:42</div>
        <div class="watch-sub">remaining</div>
        <div class="watch-mid" style="color:#66b7e6;margin-top:8px;">HR 154 / RPE 7-8</div>
        <div class="watch-sub">Next: 2:00 easy</div>
        <div class="spacer"></div>
        <div class="watch-button dark">Pause</div>
      </div></div>
    </section>
  </main>
</body>
</html>
