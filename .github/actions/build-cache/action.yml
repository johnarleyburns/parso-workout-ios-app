name: Cadence build cache
description: >-
  Restore compiled outputs scoped to toolchain, platform and build role.
  Saving is deliberately not done here: a composite action finishes before the
  caller's build step, so the workflow saves with actions/cache/save afterwards.
inputs:
  scope:
    description: host, device (unsigned fast Release), or archive (signed Release)
    required: true
outputs:
  derived-data:
    description: Stable repository-specific DerivedData directory
    value: ${{ steps.identity.outputs.derived-data }}
  source-packages:
    description: Stable repository-specific package checkout directory
    value: ${{ steps.identity.outputs.source-packages }}
  matched-key:
    description: Key of the restored cache, empty when nothing was restored
    value: ${{ steps.restore-host.outputs.cache-matched-key || steps.restore-device.outputs.cache-matched-key }}
  key:
    description: Key to use when the caller saves the build after it runs
    value: ${{ steps.identity.outputs.key }}
runs:
  using: composite
  steps:
    - name: Compute build cache identity
      id: identity
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
      run: python3 scripts/ci-cache-key.py "$CACHE_SCOPE" >> "$GITHUB_OUTPUT"
    - name: Restore host build outputs
      id: restore-host
      if: inputs.scope == 'host'
      uses: actions/cache/restore@v6
      with:
        path: CadenceCore/.build
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}
    - name: Restore device build outputs
      id: restore-device
      if: inputs.scope != 'host'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.identity.outputs.derived-data }}
          ${{ steps.identity.outputs.source-packages }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}
