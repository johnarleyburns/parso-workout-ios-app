name: Claude Issue to PR
run-name: Issue #${{ inputs.issue_number }} controller attempt
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number
        required: true
        type: number
      attempt_id:
        description: Controller reservation generation
        required: true
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: claude-issue-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  verify-reservation:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      ISSUE: ${{ inputs.issue_number }}
      ATTEMPT: ${{ inputs.attempt_id }}
      CLAUDE_PIPELINE_AUTO_ENABLED: ${{ vars.CLAUDE_PIPELINE_AUTO_ENABLED }}
    steps:
      - id: verify
        run: |
          marker="<!-- claude-intake-reservation issue=${ISSUE} attempt=${ATTEMPT} -->"
          if [[ "$CLAUDE_PIPELINE_AUTO_ENABLED" != true ]]; then echo 'valid=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          found=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" --jq '.[] | .body' | grep -Fxc "$marker" || true)
          if jq -e 'index("intake-running") != null' <<<"$labels" >/dev/null && [[ "$found" -gt 0 ]]; then echo 'valid=true' >> "$GITHUB_OUTPUT"; else echo 'valid=false' >> "$GITHUB_OUTPUT"; fi
  implement:
    needs: verify-reservation
    if: needs.verify-reservation.outputs.valid == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      ISSUE: ${{ inputs.issue_number }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: sonnet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Claude Code
        run: |
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"; sudo xcode-select -s "$XCODE"; xcodebuild -version
      - name: Implement and open draft PR
        run: |
          cp .github/scripts/issue-to-pr.sh "$RUNNER_TEMP/issue-to-pr-runner.sh"
          mkdir -p /tmp/claude-issue-logs
          bash "$RUNNER_TEMP/issue-to-pr-runner.sh" 2>&1 | tee /tmp/claude-issue-logs/runner.log
          exit "${PIPESTATUS[0]}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ env.ISSUE }}-validation
          path: /tmp/claude-issue-logs/
          if-no-files-found: ignore
          retention-days: 7
  finalize:
    needs: [verify-reservation, implement]
    if: always() && needs.verify-reservation.outputs.valid == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      ISSUE: ${{ inputs.issue_number }}
      ATTEMPT: ${{ inputs.attempt_id }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/finalize-issue-intake.sh "${{ needs.implement.result }}" "$ATTEMPT"
