<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone - After Set Rest</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>iPhone - After Set Rest</h1>
        <p>Immediate result feedback, rest countdown, and next-set preview for the phone runner.</p>
      </div>
      <div class="mockup-meta"><span class="tag">Section 27</span><span class="tag">Rest mirror</span></div>
    </header>

    <section class="device-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="island"></div>
          <div class="ios-status"><span>9:41</span><span>5G 82%</span></div>
          <div class="ios-content" style="display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:30px;">
            <span class="pill progress" style="align-self:center;">Harder than planned</span>
            <h2 style="font-family:var(--cond);font-size:36px;margin:18px 0 4px;">Set complete</h2>
            <p class="mono" style="margin:0;color:var(--muted);">8 reps / 140 lb / RPE 8</p>
            <div class="mono" style="font-size:54px;font-weight:900;margin:30px 0 0;">1:46</div>
            <div class="ios-section-title" style="margin-top:0;">Rest remaining</div>
            <article class="ios-card" style="text-align:left;">
              <h3>Next set</h3>
              <div class="sub mono">6 reps / 160 lb / target RPE 8</div>
            </article>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;"><button class="button">Adjust next</button><button class="button dark">Continue</button></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
