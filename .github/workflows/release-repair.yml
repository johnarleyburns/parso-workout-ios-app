name: Claude Release Repair

on:
  workflow_run:
    workflows: ["iOS Build & TestFlight"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed main iOS Build & TestFlight run to triage
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-release-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'johnarleyburns')
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id || inputs.failed_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install Claude Code
        run: |
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Repair failed main release once
        run: |
          cp .github/scripts/release-repair.sh "$RUNNER_TEMP/release-repair.sh"
          bash "$RUNNER_TEMP/release-repair.sh"
      - name: Upload repair logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-repair-${{ env.FAILED_RUN_ID }}-${{ github.run_id }}
          path: /tmp/claude-release-repair/
          if-no-files-found: ignore
          retention-days: 14
