name: iOS

# TestFlight build trigger: 2026-11-28 1.1 verification (build number is commit
# count; marketing version comes from the Xcode project and is guarded against drift).
# One pipeline for pull requests and main. A pull request runs the pre-merge
# gate (host-tests, app-build, validate). A push to main runs the same test job
# plus the signed archive and TestFlight upload. Keeping both in one file is
# what prevents the two definitions from drifting apart.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      force_tests:
        description: Run the full host suite even when this tree already passed on its PR
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never cancel an in-flight release build (build numbers must stay monotonic);
# later merges queue behind it. A pull request's newer push supersedes its run.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The attestation compares this commit's tree with the merged PR head.
          fetch-depth: 0

      - name: Check whether this tree was already validated on its pull request
        id: attest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_tests && '1' || '0' }}
        run: bash .github/scripts/tree-validation-attestation.sh >> "$GITHUB_OUTPUT"

      - name: Select supported release Xcode
        if: steps.attest.outputs.skip != 'true'
        run: |
          # The runner image also contains beta builds. App Store Connect
          # rejects archives made with a beta SDK (90534), so TestFlight and
          # host tests must select the newest non-beta/non-RC installation.
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' \
            ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Accept Xcode License
        if: steps.attest.outputs.skip != 'true'
        run: sudo xcodebuild -license accept

      - uses: ./.github/actions/build-cache
        id: cache
        if: steps.attest.outputs.skip != 'true'
        with:
          scope: host

      - name: Run static checks and SwiftPM package tests
        if: steps.attest.outputs.skip != 'true'
        run: |
          bash scripts/ci-validate.sh --fast
          bash scripts/ci-validate.sh --tests

      - name: Check warning classifier fixtures
        if: steps.attest.outputs.skip != 'true'
        run: bash scripts/test-check-owned-warnings.sh

      - name: Check TestFlight reporting fixture
        if: steps.attest.outputs.skip != 'true'
        run: |
          bash scripts/tests/test-testflight-delivery-body.sh
          bash scripts/tests/test-testflight-reconciler-discovery.sh

      - name: Test-pyramid guardrail
        if: steps.attest.outputs.skip != 'true'
        run: bash scripts/check-test-pyramid.sh

      - name: No-network guardrail
        if: steps.attest.outputs.skip != 'true'
        run: bash scripts/check-no-network.sh

      - name: History persistence safety guardrail
        if: steps.attest.outputs.skip != 'true'
        run: bash scripts/check-history-safety.sh

      - name: Watch AppIcon and Xcode platform guardrails
        if: steps.attest.outputs.skip != 'true'
        run: |
          bash scripts/check-watch-appicon.sh
          bash scripts/check-watch-background-modes.sh
          bash scripts/check-xcodebuild-platform.sh
          bash scripts/check-ci-no-simulators.sh
          bash scripts/check-release-safety.sh

      - name: Save the shared host cache
        if: steps.attest.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: CadenceCore/.build
          key: ${{ steps.cache.outputs.key }}

  # There is no XCUITest/simulator suite in this repo: simulator-based UI tests
  # were removed (unreliable on shared runners — cold-launch timing, shared CPU —
  # and this CI environment cannot boot simulators at all). The CI gate is
  # host-tests (SwiftPM package tests + guardrails) plus app-build.

  app-build:
    # Pull requests: the pre-merge compile gate. main: the cache seeder.
    # GitHub only lets a pull request restore from its own ref and the default
    # branch, so a cache written on refs/pull/N/merge is invisible to every
    # other PR; the default branch has to write the seed that PRs restore.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      # Same Release configuration and source set as the archive, without
      # whole-module optimization. ~3x faster and still warning-complete.
      CADENCE_FAST_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: ./.github/actions/build-cache
        id: cache
        with:
          scope: device

      - name: iPhone and embedded Watch build with guardrails
        # On main this job exists only to keep the shared cache warm, so it
        # skips a rebuild when a matching seed already exists.
        if: github.event_name == 'pull_request' || steps.cache.outputs.matched-key == ''
        env:
          CADENCE_DERIVED_DATA: ${{ steps.cache.outputs.derived-data }}
          CADENCE_SOURCE_PACKAGES: ${{ steps.cache.outputs.source-packages }}
        run: bash scripts/ci-validate.sh --build

      - name: Upload build transcript
        if: always() && (github.event_name == 'pull_request' || steps.cache.outputs.matched-key == '')
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-validate-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save the shared device cache
        # Only main may seed: GitHub restores a PR cache for its own ref only.
        # Saving after the build is what makes the seed contain compiled output.
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.cache.outputs.derived-data }}
            ${{ steps.cache.outputs.source-packages }}
          key: ${{ steps.cache.outputs.key }}

  validate:
    # The required status context for merging into main. Runs only on pull
    # requests and fails closed on any non-success result from either gate.
    if: always() && github.event_name == 'pull_request'
    needs: [host-tests, app-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both validation jobs
        env:
          HOST_TESTS: ${{ needs.host-tests.result }}
          APP_BUILD: ${{ needs.app-build.result }}
        run: |
          test "$HOST_TESTS" = success && test "$APP_BUILD" = success

  archive:
    # Signed release build and upload are main-only.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      build-number: ${{ steps.version.outputs.build-number }}
    # Runs alongside host-tests; upload is a downstream job requiring both.
    runs-on: xcode-27
    # Archives can legitimately be slower than a compile, but must not consume
    # a permit forever if Xcode or an external signing service stops responding.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select supported release Xcode
        run: |
          # Never let a beta Xcode win merely because it sorts newest: App
          # Store Connect rejects beta SDK archives with error 90534.
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' \
            ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - uses: ./.github/actions/release-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          phone-profile: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          watch-profile: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
          widget-profile: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          watch-widget-profile: ${{ secrets.WATCH_WIDGET_PROVISIONING_PROFILE_BASE64 }}

      - uses: ./.github/actions/build-cache
        id: cache
        with:
          scope: archive

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence \
            -clonedSourcePackagesDirPath "${{ steps.cache.outputs.source-packages }}"

      - name: Set App/TestFlight Build Number
        id: version
        run: |
          set -eo pipefail
          # CFBundleVersion is the number shown by AboutView and must remain
          # monotonically increasing for App Store Connect. GitHub's workflow
          # run_number is a separate UI identifier and must not be used here.
          BUILD=$(git rev-list --count HEAD)
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "build-number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "App/TestFlight build number (About screen): $BUILD"
          {
            echo "### App/TestFlight build"
            echo "- App Store build / About screen: **$BUILD**"
            echo "- GitHub Actions workflow run: **#${GITHUB_RUN_NUMBER}** (separate identifier)"
          } >> "$GITHUB_STEP_SUMMARY"
          cd Cadence && xcrun agvtool new-version -all "$BUILD"

      - name: Compute Marketing Version
        env:
          # Public version string shown on the App Store and in About.
          # MARKETING_VERSION in the Xcode project is the source of truth; the
          # repository variable may override it, but a mismatch fails instead
          # of silently uploading under a version TestFlight is not showing.
          CONFIGURED_MARKETING_VERSION: ${{ vars.MARKETING_VERSION }}
        run: |
          set -eo pipefail
          project_version="$(grep -m1 -E 'MARKETING_VERSION = ' Cadence/Cadence.xcodeproj/project.pbxproj \
            | sed -E 's/.*MARKETING_VERSION = ([^;]+);/\1/' | tr -d '[:space:]')"
          MKT_VERSION="${CONFIGURED_MARKETING_VERSION:-$project_version}"
          if [ -z "$MKT_VERSION" ]; then
            echo "::error title=Missing marketing version::Set MARKETING_VERSION in the Xcode project or the repository variable."
            exit 1
          fi
          if [ -n "$project_version" ] && [ "$MKT_VERSION" != "$project_version" ]; then
            echo "::error title=Marketing version mismatch::Workflow would upload '$MKT_VERSION' but the Xcode project says '$project_version'. Align them before uploading."
            exit 1
          fi
          echo "MKT_VERSION=$MKT_VERSION" >> "$GITHUB_ENV"
          echo "Marketing version: $MKT_VERSION (build $BUILD_NUMBER, project $project_version)"

      - name: Archive
        id: archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -eo pipefail
          archive_diagnostics() {
            status=$?
            echo "::group::Archive diagnostics (exit $status)"
            date -u
            ps -axo pid,ppid,etime,command | grep -E '[x]codebuild|[s]wift|[x]cbuild' || true
            tail -200 build.log 2>/dev/null || true
            echo "::endgroup::"
            return "$status"
          }
          trap archive_diagnostics ERR
          bash scripts/xcodebuild-safe.sh archive \
            -project Cadence/Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Cadence.xcarchive \
            -derivedDataPath "${{ steps.cache.outputs.derived-data }}" \
            -clonedSourcePackagesDirPath "${{ steps.cache.outputs.source-packages }}" \
            -showBuildTimingSummary \
            MARKETING_VERSION="$MKT_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            "DEVELOPMENT_TEAM=$TEAM_ID" \
            2>&1 | tee build.log
          if [ ! -d "./build/Cadence.xcarchive" ]; then
            echo "Archive not found — build failed"
            grep -E 'error:' build.log | head -20
            exit 1
          fi

          IOS_PLIST="./build/Cadence.xcarchive/Products/Applications/Cadence.app/Info.plist"
          WATCH_PLIST="./build/Cadence.xcarchive/Products/Applications/Cadence.app/Watch/Cadence Watch App Watch App.app/Info.plist"
          for PLIST in "$IOS_PLIST" "$WATCH_PLIST"; do
            if [ ! -f "$PLIST" ]; then
              echo "Missing archived bundle Info.plist: $PLIST"
              exit 1
            fi
            SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
            echo "$PLIST: $SHORT ($VERSION)"
            test "$SHORT" = "$MKT_VERSION"
            test "$VERSION" = "$BUILD_NUMBER"
          done

      - name: Check owned archive warnings
        id: warnings
        if: success()
        run: bash scripts/check-owned-warnings.sh build.log

      - name: Normalize watch background modes
        if: success()
        run: |
          set -eo pipefail
          # UIBackgroundModes keeps only audio (short workout audio clips).
          # workout-processing is not a valid UIBackgroundModes value for a
          # watchOS app and is rejected by App Store Connect validation; it
          # belongs in WKBackgroundModes, which this step leaves alone. Without
          # it watchOS suspends the app when the screen turns off, and live
          # heart rate stops reaching the phone.
          WATCH_PLIST="./build/Cadence.xcarchive/Products/Applications/Cadence.app/Watch/Cadence Watch App Watch App.app/Info.plist"
          if [ ! -f "$WATCH_PLIST" ]; then
            echo "Watch Info.plist not found at expected path, trying alternate..."
            WATCH_PLIST=$(find ./build/Cadence.xcarchive -path "*/Watch/*.app/Info.plist" | head -1)
          fi
          if [ -f "$WATCH_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$WATCH_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$WATCH_PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$WATCH_PLIST"
            echo "Preserved audio in $WATCH_PLIST"
            if ! /usr/libexec/PlistBuddy -c "Print :WKBackgroundModes" "$WATCH_PLIST" 2>/dev/null | grep -q "workout-processing"; then
              echo "Watch Info.plist is missing WKBackgroundModes workout-processing"
              exit 1
            fi
            echo "Kept WKBackgroundModes workout-processing in $WATCH_PLIST"
          fi

      - name: Verify release dSYMs cover every app binary
        run: bash scripts/verify-archive-dsyms.sh ./build/Cadence.xcarchive

      - name: Retain release dSYMs for crash resolution
        if: success()
        uses: actions/upload-artifact@v7
        with:
          # BUILD_NUMBER is the same monotonic CFBundleVersion sent to TestFlight.
          name: testflight-dsyms-${{ env.BUILD_NUMBER }}
          path: build/Cadence.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 90

      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-diagnostics-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package signed archive
        id: package
        run: tar -cf "$RUNNER_TEMP/Cadence.xcarchive.tar" -C build Cadence.xcarchive

      - name: Retain signed archive for gated upload
        id: handoff
        uses: actions/upload-artifact@v7
        with:
          name: signed-archive-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/Cadence.xcarchive.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Record archive stage
        id: stage
        if: always()
        env:
          ARCHIVE: ${{ steps.archive.outcome }}
          WARNINGS: ${{ steps.warnings.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
        run: |
          stage=setup
          if [[ "$WARNINGS" == failure ]]; then stage=warnings
          elif [[ "$ARCHIVE" == failure ]]; then stage=archive
          elif [[ "$PACKAGE" == failure || "$HANDOFF" == failure ]]; then stage=handoff
          elif [[ "$HANDOFF" == success ]]; then stage=archived
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

  testflight-build:
    needs: [host-tests, archive]
    if: always() && github.ref == 'refs/heads/main' && needs.host-tests.result == 'success' && needs.archive.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    env:
      BUILD_NUMBER: ${{ needs.archive.outputs.build-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select supported release Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Accept Xcode License
        run: sudo xcodebuild -license accept

      - uses: ./.github/actions/release-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          phone-profile: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          watch-profile: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
          widget-profile: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          watch-widget-profile: ${{ secrets.WATCH_WIDGET_PROVISIONING_PROFILE_BASE64 }}

      - name: Write App Store Connect API Key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Download signed archive
        uses: actions/download-artifact@v8
        with:
          name: signed-archive-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/signed-archive

      - name: Restore signed archive
        run: |
          mkdir -p build
          tar -xf "$RUNNER_TEMP/signed-archive/Cadence.xcarchive.tar" -C build

      - name: Export IPA
        id: export
        run: |
          set -eo pipefail
          xcodebuild -exportArchive \
            -archivePath ./build/Cadence.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        id: upload
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          upload_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          cp ExportOptions.plist "$upload_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$upload_options"
          bash .github/scripts/testflight-upload.sh -- \
            xcodebuild -exportArchive \
              -archivePath ./build/Cadence.xcarchive \
              -exportPath ./output \
              -exportOptionsPlist "$upload_options" \
              -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
              -authenticationKeyID "$APPSTORE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Upload TestFlight transport diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-transport.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record TestFlight delivery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: Cadence
          ARCHIVED_APP: ./build/Cadence.xcarchive/Products/Applications/Cadence.app
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
        run: bash .github/scripts/record-testflight-delivery.sh

      - name: Record upload stage
        id: stage
        if: always()
        env:
          EXPORT: ${{ steps.export.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          stage=setup
          if [[ "$UPLOAD" == success ]]; then stage=uploaded
          elif [[ "$UPLOAD" == failure ]]; then stage=upload
          elif [[ "$EXPORT" == failure ]]; then stage=export
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

  # Records the post-merge outcome on the merged PR. Uses only GITHUB_TOKEN with
  # issue/PR comment scope and no release secrets. "Uploaded" means Xcode's
  # accepted the build; Apple processing / tester availability is NOT claimed.
  deployment-report:
    needs: [host-tests, archive, testflight-build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Report deployment outcome
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.host-tests.result }}
          BUILD: ${{ needs.testflight-build.result }}
          STAGE: ${{ needs.testflight-build.outputs.stage || needs.archive.outputs.stage }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$TESTS" != success ]]; then
            status="FAILED at package tests/guardrails (code-related: needs a new protected repair PR; main is never rewritten)"
          elif [[ "$BUILD" == success && "$STAGE" == uploaded ]]; then
            status="build archived, exported and uploaded to App Store Connect (processing/tester availability not yet confirmed)"
          else
            case "$STAGE" in
              archive) status="FAILED at archive compilation (code-related: see build log artifact; not a signing issue unless the log says so)" ;;
              warnings) status="FAILED at the owned archive warning gate (code-related: fix the application-owned compiler warning; not a signing or App Store Connect problem)" ;;
              handoff) status="FAILED while retaining the signed archive for the gated upload job" ;;
              export) status="FAILED at IPA export (check provisioning profiles/ExportOptions; owner action may be needed)" ;;
              upload) status="FAILED at TestFlight upload (check App Store Connect API credentials/status; owner action may be needed)" ;;
              *) status="FAILED before archive (setup: certificates, profiles, package resolution; job result: $BUILD)" ;;
            esac
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty' || { echo "::warning::could not look up PR"; true; })
          msg="**Post-merge deployment ($SHA):** $status. [Run]($url)"
          if [[ -n "$pr" ]]; then gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$msg" || echo "::warning::could not post PR comment"; fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TESTS" != success || "$BUILD" != success ]]; then
            echo "::error::$status"; exit 1
          fi
