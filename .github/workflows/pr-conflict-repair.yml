name: Claude PR Conflict Repair
# Repairs exactly one PR per run (conflicts, branch freshness, failed
# validation). Dispatched by "Claude PR Maintenance"; the owner may also
# dispatch it by hand. It never decides readiness or merging.
run-name: "Repair PR #${{ inputs.pr_number }} (${{ github.event_name }})"
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Claude PR to repair
        required: true
        type: number
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
# One writer per PR branch. Different PRs have different groups, so a request
# for one PR can never cancel another PR's repair. If a second request for the
# same PR queues behind a running one, GitHub keeps only the newest pending
# run; that is safe because maintenance re-evaluates and re-dispatches every
# sweep, so no request is lost.
concurrency:
  group: claude-pr-repair-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor == 'johnarleyburns' || github.actor == 'github-actions[bot]'
    runs-on: xcode-27
    # Shared, repository-wide macOS permit; keep the per-PR workflow lock above.
    concurrency:
      group: cadence-macos
      cancel-in-progress: false
      queue: max
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: sonnet
      TARGET_PR: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # the token is passed per git command, never stored for Claude
      - name: Install Claude Code
        run: |
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Select stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Repair PR
        run: |
          cp .github/scripts/pr-conflict-repair.sh "$RUNNER_TEMP/pr-conflict-repair-runner.sh"
          bash "$RUNNER_TEMP/pr-conflict-repair-runner.sh"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-repair-${{ inputs.pr_number }}-${{ github.run_id }}
          path: /tmp/claude-issue-logs/
          if-no-files-found: ignore
          retention-days: 7
