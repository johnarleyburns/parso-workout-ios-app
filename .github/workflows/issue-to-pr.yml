
name: Claude Issue to Draft PR
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to implement'
        required: true
        type: number
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: claude-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  implement:
    if: github.actor == 'johnarleyburns'
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authentication is configured
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: test -n "$OAUTH" || { echo 'Missing CLAUDE_CODE_OAUTH_TOKEN'; exit 1; }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Select stable Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' ! -iname '*beta*' ! -iname '*rc*' -print | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Implement, compile, and repair (maximum two repairs)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: bash .github/scripts/issue-to-pr.sh
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ env.ISSUE }}-build-logs
          path: /tmp/claude-issue-logs/
          if-no-files-found: ignore
          retention-days: 7
