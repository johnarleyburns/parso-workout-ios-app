<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch - Cardio Complete</title>
  <link rel="stylesheet" href="cladiron-mockups.css">
</head>
<body>
  <main class="mockup-page">
    <header class="mockup-header">
      <div>
        <h1>Watch - Cardio Complete</h1>
        <p>Cardio result captured from native workout tracking before optional session-level effort.</p>
      </div>
      <div class="mockup-meta"><span class="tag">WatchCardioSummaryView</span><span class="tag">Cardio result</span></div>
    </header>
    <section class="device-stage">
      <div class="watch-frame"><div class="watch-screen">
        <div class="watch-kicker">Bike complete</div>
        <div class="watch-big" style="font-size:42px;">27:48</div>
        <div class="watch-mid" style="color:#66b7e6;">Avg HR 142</div>
        <div class="watch-list">
          <div class="watch-row"><strong>Intervals</strong>6/6 completed</div>
          <div class="watch-row"><strong>Range</strong>118-166 bpm</div>
        </div>
        <div class="spacer"></div>
        <div class="watch-button">Continue</div>
      </div></div>
    </section>
  </main>
</body>
</html>
